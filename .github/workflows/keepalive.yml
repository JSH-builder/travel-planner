# Supabase 무료 프로젝트는 7일 동안 요청이 없으면 일시정지된다.
# 매일 한 번 가벼운 조회를 보내 깨워 둔다. (공개용 publishable 키만 사용 — docs/config.js에 이미 공개된 값)
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 21 * * *"   # 매일 06:17 (한국 시간)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs/config.js
          sparse-checkout-cone-mode: false
      - name: Ping Supabase
        run: |
          URL=$(grep -o '"url": *"[^"]*"' docs/config.js | sed 's/.*"\(https[^"]*\)"/\1/')
          KEY=$(grep -o '"key": *"[^"]*"' docs/config.js | sed 's/.*"key": *"\([^"]*\)"/\1/')
          for i in 1 2 3; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/rest/v1/rpc/trip_exists" \
              -H "apikey: $KEY" -H "Content-Type: application/json" -d '{"p_id":"keepalive"}')
            echo "attempt $i → HTTP $CODE"
            [ "$CODE" = "200" ] && exit 0
            sleep 20
          done
          echo "::error::Supabase did not answer — it may be paused. Restore it in the Supabase dashboard."
          exit 1
